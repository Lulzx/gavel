[project]
name = "gavel"
version = "0.1.0"
description = "A verifiable-reward RL environment in which the Bend proof checker is the reward."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gavel = "gavel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gavel"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
