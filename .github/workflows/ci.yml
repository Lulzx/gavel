name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: harness (dev backend)
    runs-on: ubuntu-latest
    env:
      # The runner image has no bubblewrap and this job is about the harness
      # rather than the boundary, so isolation is opted out of once, here. The
      # opt-out is not invisible: every verdict computed in this job carries
      # `backend: plain` and `dev_only: true`.
      GAVEL_BACKEND: plain
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The checker is the reward signal and it runs on bun, so a job without
      # bun cannot run a single check -- which is what this job was doing: every
      # checker test errored at the `toolchain` fixture and the suite reported
      # it as 140 test errors rather than as a missing runtime.
      - uses: oven-sh/setup-bun@v2
        with:
          # A second copy of the pin in toolchain/bun.version. The step below is
          # what makes that safe: two homes for one pin are fine as long as they
          # cannot disagree without the build saying so.
          bun-version: 1.3.14

      - name: The bun pin is the one the toolchain pins
        run: test "$(bun --version)" = "$(cat toolchain/bun.version)"

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q

      - name: The bank validates
        # --jobs because the bank outgrew a serial pass: the cost is one bun
        # process per check and ~15 checks per task, so 58 tasks took over 18
        # minutes on a runner with nothing else to do. A task's checks are
        # independent, so this is the whole speedup, and the runner's cores are
        # the ceiling.
        run: uv run python -m tools.validate --jobs 4

      - name: The bank is in sync with its tasks
        run: |
          uv run python -m tools.publish
          git diff --exit-code -- manifest.json

  sandbox:
    name: adversarial corpus under bubblewrap
    runs-on: ubuntu-latest
    # Verified on a Linux host now, and it took four flags to get there. A
    # nested sandbox needs the outer container to be permissive, and the four
    # obstacles were met one at a time, each measured against the real job:
    #
    #   seccomp          blocks the clone(CLONE_NEWUSER) bwrap starts with
    #   capabilities     no CAP_SYS_ADMIN, so `mount / slave` is refused
    #   AppArmor         docker-default denies mount outright, caps or not
    #   masked /proc     "Can't mount proc on /proc: Operation not permitted"
    #
    # The last one is not a capability at all -- Docker remounts /proc and masks
    # a set of paths inside the container, and a new procfs cannot be mounted
    # over the result. `--privileged` is what removes all four, which is why it
    # replaced the three narrower flags rather than joining them: SYS_ADMIN and
    # the two security-opts are subsumed.
    #
    # None of this weakens what is under test. The privilege is granted to the
    # CI container so that it can host a sandbox; the inner bwrap still unshares
    # every namespace and is the thing the adversarial corpus is attacking.
    #
    # Green in 35338052842, and green in every run since 35337093806 -- which is
    # the run worth remembering, because the first time the sandbox actually
    # ran it failed a test that had passed on the plain backend for its whole
    # life: a stand-in checker written into pytest's tmp_path, which the sandbox
    # shadows with a fresh tmpfs on /tmp. A job that is allowed to fail is a job
    # nobody reads, and that bug is the whole argument for this one.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t gavel:ci .

      - name: The sandbox runs a real check
        run: |
          docker run --rm \
            --privileged \
            gavel:ci uv run python -m tools.sandbox_check --backend bwrap

      - name: The adversarial corpus under the sandbox
        run: |
          docker run --rm \
            --privileged \
            gavel:ci uv run pytest -q tests/test_adversarial.py tests/test_checker.py
