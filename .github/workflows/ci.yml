name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: harness (dev backend)
    runs-on: ubuntu-latest
    env:
      # The runner image has no bubblewrap and this job is about the harness
      # rather than the boundary, so isolation is opted out of once, here. The
      # opt-out is not invisible: every verdict computed in this job carries
      # `backend: plain` and `dev_only: true`.
      GAVEL_BACKEND: plain
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The checker is the reward signal and it runs on bun, so a job without
      # bun cannot run a single check -- which is what this job was doing: every
      # checker test errored at the `toolchain` fixture and the suite reported
      # it as 140 test errors rather than as a missing runtime.
      - uses: oven-sh/setup-bun@v2
        with:
          # A second copy of the pin in toolchain/bun.version. The step below is
          # what makes that safe: two homes for one pin are fine as long as they
          # cannot disagree without the build saying so.
          bun-version: 1.3.14

      - name: The bun pin is the one the toolchain pins
        run: test "$(bun --version)" = "$(cat toolchain/bun.version)"

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest -q

      - name: The bank validates
        run: uv run python -m tools.validate

      - name: The bank is in sync with its tasks
        run: |
          uv run python -m tools.publish
          git diff --exit-code -- manifest.json

  sandbox:
    name: adversarial corpus under bubblewrap
    runs-on: ubuntu-latest
    # Not yet verified on a Linux host, and these three flags are the whole
    # question. Bubblewrap has to re-mount `/` as a slave before it can unshare
    # the mount namespace, and Docker's default set gets in the way three times:
    # seccomp blocks the clone(CLONE_NEWUSER) bwrap starts with, capabilities
    # omit CAP_SYS_ADMIN so the mount is refused, and AppArmor's docker-default
    # profile denies mount outright regardless of capabilities. Measured, one at
    # a time: seccomp alone still failed, seccomp + SYS_ADMIN still failed with
    # "Failed to make / slave: Permission denied", which is the AppArmor
    # signature rather than a capability one.
    #
    # None of this is about the sandbox being tested -- the inner bwrap still
    # unshares everything, which is what the job exists to demonstrate. Left
    # non-blocking until a green run exists, then flip this to false: a job that
    # is allowed to fail is a job nobody reads.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t gavel:ci .

      - name: The sandbox runs a real check
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            gavel:ci uv run python -m tools.sandbox_check --backend bwrap

      - name: The adversarial corpus under the sandbox
        run: |
          docker run --rm \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            gavel:ci uv run pytest -q tests/test_adversarial.py tests/test_checker.py
